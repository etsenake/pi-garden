appId: com.pi-garden.desktop
# Display name everywhere the OS shows the app. File and install identities
# (artifacts, executables, Linux /opt dir, Homebrew cask) stay pi-garden.
productName: Pi Garden
copyright: Copyright 2026 Josh Etsenake
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # The pnpm collector drops this nested version in the hoisted layout.
  # Keep retry 0.12 for Pi's lockfile code; other consumers require root 0.13.
  - from: ../../node_modules/proper-lockfile/node_modules/retry
    to: node_modules/proper-lockfile/node_modules/retry
    filter:
      - "**/*"
  # The collector nests the newer SSO under Bedrock. Its token provider must
  # stay below SSO: Bedrock itself pins a different token-provider version.
  - from: ../../node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    to: node_modules/@aws-sdk/client-bedrock-runtime/node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    filter:
      - "**/*"

extraResources:
  - from: resources/icon.png
    to: icon.png
  # Skills pi-garden adds to every Pi session (see main.ts bundledSkillsDir).
  - from: resources/skills
    to: skills
  # The helper package an adapted extension vendors; main bundles it, so the
  # packaged app needs a plain copy Pi's bash tool can read.
  - from: ../../packages/extension-ui
    to: extension-ui
    filter:
      - package.json
      - "dist/**/*"
  # Searchable Pi and Pi Garden docs, types and source (build:reference).
  - from: build/reference
    to: reference

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: pi-garden-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-garden-notification-status-helper
      to: MacOS/pi-garden-notification-status-helper

linux:
  category: Development
  executableName: pi-garden
  # Linux packaging runs with -c.productName=pi-garden so /opt/pi-garden stays
  # stable; only the launcher shows the display name.
  desktop:
    entry:
      Name: Pi Garden
  maintainer: Josh Etsenake <josh.etsenake@fullscript.com>
  vendor: pi-garden
  synopsis: Codex-style desktop app for the pi coding agent
  description: A native desktop interface for pi coding agent sessions, workspaces, and tools.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  artifactName: pi-garden_${version}_${arch}.${ext}
  packageName: pi-garden
  packageCategory: devel
  priority: optional
  afterRemove: resources/linux/after-remove.sh
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1

win:
  executableName: pi-garden
  # Keep icon/version metadata editing; signing is optional without credentials.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: pi-garden-${version}-${arch}-setup.${ext}

portable:
  artifactName: pi-garden-${version}-${arch}-portable.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: etsenake
  repo: pi-garden
